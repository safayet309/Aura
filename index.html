<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আমার অরা — তোমার আত্মা-রূপ বের করো</title>
<meta name="theme-color" content="#120B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="আমার অরা">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120B2E;--fg:#FFF4E0;--muted:#B9AEDB;--field:#1F1547;--line:#3A2C78;--hot:#E8337A;--sun:#FFB627;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#FFF4E0;--fg:#1A1038;--muted:#6B5C99;--field:#FFFFFF;--line:#D9C9F5}}
:root[data-theme="light"]{--bg:#FFF4E0;--fg:#1A1038;--muted:#6B5C99;--field:#FFFFFF;--line:#D9C9F5}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;line-height:1.5;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:2.3rem;line-height:1.15;margin:8px 0 6px;font-weight:700;letter-spacing:-.01em}
h1 span{background:linear-gradient(90deg,var(--hot),var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{color:var(--muted);margin:0 0 18px}
.banner{background:linear-gradient(90deg,var(--hot),#8A2BE2);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:600}
label{display:block;font-weight:600;margin:12px 0 6px}
input{width:100%;font:inherit;font-size:1.1rem;color:var(--fg);background:var(--field);border:2px solid var(--line);border-radius:14px;padding:13px 14px;outline:none}
input:focus-visible{border-color:var(--sun);box-shadow:0 0 0 3px rgba(255,182,39,.3)}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:14px;padding:13px 16px;color:#1A1038;background:var(--sun)}
button.main{width:100%;margin-top:14px;font-size:1.15rem;background:linear-gradient(90deg,var(--hot),var(--sun));color:#fff}
button.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row button{flex:1 1 140px}
#out{display:none;margin-top:22px}
canvas{width:100%;height:auto;border-radius:20px;display:block;box-shadow:0 18px 50px rgba(232,51,122,.28)}
.match{margin-top:18px;border-top:1px dashed var(--line);padding-top:6px}
.fortune{margin-top:16px;padding:14px 16px;border-radius:16px;border:2px dashed var(--line);white-space:pre-line}
.fortune b{color:var(--sun)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div id="banner" class="banner" hidden></div>
  <button class="ghost" id="inst" hidden style="float:right;padding:8px 12px">অ্যাপ ইনস্টল করো</button>
  <h1>তোমার <span>আত্মা-রূপ</span> কী?</h1>
  <p class="sub">নাম লেখো। নামের ভেতরের রং, মেজাজ আর বাংলার এক অদ্ভুত চরিত্র বেরিয়ে আসবে — আর কার্ডটা একদম শুধু তোমার।</p>

  <label for="nm">তোমার নাম</label>
  <input id="nm" maxlength="24" autocomplete="off" placeholder="যেমন: তানভীর">
  <button class="main" id="go">আমার অরা দেখাও</button>

  <section id="out" aria-live="polite">
    <canvas id="cv" width="1080" height="1350" role="img" aria-label="তোমার অরা কার্ড"></canvas>
    <div class="row">
      <button id="share">কার্ড শেয়ার করো</button>
      <button class="ghost" id="save">ছবি সেভ করো</button>
      <button class="ghost" id="remix">🎲 আরেকটা রূপ</button>
    </div>
    <div class="fortune" id="fortune"></div>
    <div class="match">
      <label for="nm2">বন্ধুর নাম লেখো, দেখো মিল কতটা</label>
      <input id="nm2" maxlength="24" autocomplete="off" placeholder="যেমন: মিতালী">
      <button class="main" id="mt">মিলিয়ে দেখো</button>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const W=1080,H=1350;
const bnDigits=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);

function xm(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
 return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0}}
function rng(s){let a=xm(s)();return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
 t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const norm=s=>s.trim().toLowerCase().replace(/\s+/g,' ');

const TYPES=[
 ['মধ্যরাতের রিকশাওয়ালা কবি','🛺','রাত দুইটায় জীবনের সবচেয়ে গভীর কথাটা তোমার মাথায় আসে।'],
 ['চায়ের দোকানের দার্শনিক','☕','এক কাপ চা আর তোমার একটা মত — দেশ চলে যায় অন্য পথে।'],
 ['বৃষ্টিবিলাসী স্বপ্নবাজ','🌧️','জানালায় বৃষ্টি পড়লেই তোমার ভেতরে একটা আস্ত সিনেমা শুরু হয়।'],
 ['লোডশেডিংয়ের গল্পরাজা','🕯️','অন্ধকার নামলেই সবাই তোমার দিকে তাকায় — এবার একটা গল্প চাই।'],
 ['ফুচকা-ফিলোসফার','🥟','ঝাল আর টকের মাঝখানে তুমি জীবনের ভারসাম্য খুঁজে পাও।'],
 ['ছাদের ঘুড়িসম্রাট','🪁','সুতো ছাড়তে আর টান দিতে তুমি জানো — জীবনেও।'],
 ['কুয়াশা-ভোরের পথিক','🌫️','সবাই যখন ঘুমে, তুমি তখন নিজের সঙ্গে একা হাঁটতে ভালোবাসো।'],
 ['ইলিশ-মেজাজি নেতা','🐟','তুমি দামি, তুমি দুর্লভ, আর তোমাকে ছাড়া আয়োজন জমে না।'],
 ['জোছনা-রাতের গিটারিস্ট','🎸','তুমি যেখানে, সেখানেই আড্ডা গান হয়ে ওঠে।'],
 ['জ্যামের ধ্যানী','🚦','ট্রাফিকে আটকে গেলেও তোমার ভেতরটা অদ্ভুত শান্ত।'],
 ['নৌকার মাঝি-মন','⛵','ঝড় এলেও তুমি হাল ছাড়ো না, শুধু গুনগুন করো।'],
 ['পুরোনো বইয়ের গন্ধশিকারি','📚','তোমার কাছে প্রতিটা বইমেলা একটা ছোট তীর্থ।'],
 ['পান্তা-ইলিশের বিদ্রোহী','🍚','পহেলা বৈশাখ তোমার ভেতরে সারা বছর জেগে থাকে।'],
 ['কাকডাকা ভোরের ক্রিকেটার','🏏','হারলেও হাসো, জিতলেও চেঁচাও — এটাই তোমার নিয়ম।'],
 ['শরতের কাশফুল-মন','🌾','তুমি আসলে একটা নরম রোদ্দুর, যে সবার মন ভালো করে দেয়।'],
 ['রাতজাগা কোডার-কবি','🌙','ভোর হলেই তোমার সেরা আইডিয়াটা ঘুমিয়ে পড়ে।']
];
const MATCH=[
 [90,'জন্ম-জন্মান্তরের জুটি','তোমরা একসঙ্গে থাকলে চা-ও বেশি মিষ্টি লাগে।'],
 [75,'চা-বিস্কুট জুটি','আলাদা ভালো, একসঙ্গে অসাধারণ।'],
 [55,'ঝগড়া-মিটমাটের জুটি','তর্ক হবে বিস্তর, কিন্তু আড্ডা কখনো থামবে না।'],
 [35,'ঝাল-মিষ্টি দ্বৈত','একজন তেঁতো, একজন মিষ্টি — স্বাদটাই আলাদা।'],
 [0,'বিপরীত মেরুর বিস্ময়','মিলে না? তাতেই তো মজা — গল্প জমবে!']
];

function wrap(t,max){const w=t.split(' ');const L=[];let c='';
 for(const x of w){const n=c?c+' '+x:x;if(ctx.measureText(n).width>max&&c){L.push(c);c=x}else c=n}
 if(c)L.push(c);return L}

function pill(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function aura(r,cx,cy,R,hues,n){
 for(let i=0;i<n;i++){
  const a=r()*Math.PI*2,d=r()*R*.55,x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d,rad=R*(.35+r()*.5);
  const h=hues[i%hues.length]+r()*30-15;
  const g=ctx.createRadialGradient(x,y,0,x,y,rad);
  g.addColorStop(0,`hsla(${h},95%,62%,.85)`);g.addColorStop(1,`hsla(${h},95%,55%,0)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rad,0,7);ctx.fill();
 }
 ctx.lineWidth=2.5;
 for(let i=0;i<22;i++){
  const rr=R*(.35+r()*.75),p=r()*6.28,k=2+Math.floor(r()*4),amp=10+r()*28;
  ctx.strokeStyle=`hsla(${hues[i%hues.length]+40},100%,85%,${.12+r()*.28})`;
  ctx.beginPath();
  for(let t=0;t<=360;t+=4){const q=t*Math.PI/180,rv=rr+Math.sin(q*k+p)*amp;
   const x=cx+Math.cos(q)*rv,y=cy+Math.sin(q)*rv;t?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  ctx.closePath();ctx.stroke();
 }
 for(let i=0;i<70;i++){const a=r()*6.28,d=R*(.2+r()*1.15);
  ctx.fillStyle=`rgba(255,244,224,${.2+r()*.6})`;ctx.beginPath();
  ctx.arc(cx+Math.cos(a)*d,cy+Math.sin(a)*d,1+r()*3,0,7);ctx.fill()}
}

function base(r,h1,h2){
 const g=ctx.createLinearGradient(0,0,W,H);
 g.addColorStop(0,`hsl(${h1},65%,10%)`);g.addColorStop(1,`hsl(${h2},70%,22%)`);
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function footer(){
 ctx.textAlign='center';ctx.fillStyle='rgba(255,244,224,.7)';ctx.font='600 34px "Hind Siliguri",sans-serif';
 ctx.fillText('তোমারটা বের করো — আমার অরা',W/2,1305);
}

let salt='';
function drawSolo(name){
 const r=rng(norm(name)+salt);
 const h1=Math.floor(r()*360),h2=(h1+90+Math.floor(r()*120))%360;
 const hues=[h1,h2,(h1+180)%360,(h2+60)%360];
 const T=TYPES[Math.floor(r()*TYPES.length)];
 const stats=[['সৃজনশীলতা',40+Math.floor(r()*60)],['ঝাঁঝ',30+Math.floor(r()*70)],['আড্ডা-শক্তি',35+Math.floor(r()*65)]];
 const rare=(1+r()*17).toFixed(1);
 base(r,h1,h2);
 aura(r,W/2,470,330,hues,9);
 ctx.textAlign='center';ctx.textBaseline='alphabetic';
 ctx.font='230px serif';ctx.fillText(T[1],W/2,555);
 // rarity pill
 ctx.font='600 34px "Hind Siliguri",sans-serif';
 const rt=`মাত্র ${bnDigits(rare)}% মানুষ এই রূপের`;const pw=ctx.measureText(rt).width+56;
 ctx.fillStyle='rgba(18,11,46,.55)';pill(W/2-pw/2,70,pw,64,32);ctx.fill();
 ctx.fillStyle='#FFB627';ctx.fillText(rt,W/2,114);
 // title
 ctx.fillStyle='#FFF4E0';ctx.font='700 84px "Hind Siliguri",sans-serif';
 const L=wrap(T[0],900);let y=L.length>1?880:920;
 L.forEach(l=>{ctx.fillText(l,W/2,y);y+=98});
 ctx.font='600 44px "Hind Siliguri",sans-serif';ctx.fillStyle='#FFB627';
 ctx.fillText('— '+name.trim()+' —',W/2,y+4);
 ctx.font='400 38px "Hind Siliguri",sans-serif';ctx.fillStyle='rgba(255,244,224,.88)';
 const Q=wrap(T[2],860);let qy=y+66;Q.forEach(l=>{ctx.fillText(l,W/2,qy);qy+=52});
 // stats
 stats.forEach((s,i)=>{
  const x=110+i*300,by=1235;
  ctx.textAlign='left';ctx.font='600 30px "Hind Siliguri",sans-serif';ctx.fillStyle='#FFF4E0';
  ctx.fillText(s[0],x,by-22);
  ctx.fillStyle='rgba(255,244,224,.2)';pill(x,by,250,16,8);ctx.fill();
  ctx.fillStyle=`hsl(${hues[i]},95%,62%)`;pill(x,by,250*s[1]/100,16,8);ctx.fill();
 });
 footer();
 return `আমার আত্মা-রূপ: ${T[0]} ${T[1]} — মাত্র ${bnDigits(rare)}% মানুষ এই রকম! তোমারটা কী?`;
}

function drawMatch(a,b){
 const key=[norm(a),norm(b)].sort().join('|');
 const r=rng('m:'+key),ra=rng(norm(a)),rb=rng(norm(b));
 const score=Math.floor(r()*101);
 const V=MATCH.find(m=>score>=m[0]);
 const ha=Math.floor(ra()*360),hb=Math.floor(rb()*360);
 base(r,ha,hb);
 ctx.globalCompositeOperation='lighter';
 aura(ra,W/2-170,460,260,[ha,ha+40],6);
 aura(rb,W/2+170,460,260,[hb,hb+40],6);
 ctx.globalCompositeOperation='source-over';
 ctx.textAlign='center';
 ctx.font='700 210px "Hind Siliguri",sans-serif';ctx.fillStyle='#FFF4E0';
 ctx.fillText(bnDigits(score)+'%',W/2,545);
 ctx.font='600 36px "Hind Siliguri",sans-serif';ctx.fillStyle='#FFB627';
 ctx.fillText('মিলের হার',W/2,610);
 ctx.font='700 58px "Hind Siliguri",sans-serif';ctx.fillStyle='#FFF4E0';
 ctx.fillText(a.trim()+'  ♥  '+b.trim(),W/2,860);
 ctx.font='700 84px "Hind Siliguri",sans-serif';
 wrap(V[1],900).forEach((l,i)=>ctx.fillText(l,W/2,980+i*98));
 ctx.font='400 40px "Hind Siliguri",sans-serif';ctx.fillStyle='rgba(255,244,224,.88)';
 wrap(V[2],860).forEach((l,i)=>ctx.fillText(l,W/2,1090+i*54));
 footer();
 return `${a.trim()} ♥ ${b.trim()}: ${bnDigits(score)}% মিল — ${V[1]}! তোমাদেরটা দেখো:`;
}

let shareText='',shareName='';
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
const params=new URLSearchParams(location.search);
const from=(params.get('from')||'').slice(0,24);
const baseUrl=()=>{try{return location.href.split('?')[0]}catch(e){return ''}};

async function ready(){try{await document.fonts.load('700 40px "Hind Siliguri"');await document.fonts.load('400 40px "Hind Siliguri"')}catch(e){}}
async function showSolo(){
 const n=$('#nm').value.trim();if(!n){toast('আগে নামটা লেখো');$('#nm').focus();return}
 salt='';await ready();shareText=drawSolo(n);shareName=n;fortune(n);
 $('#out').style.display='block';
 if(from)$('#nm2').value=from;
 cv.scrollIntoView({behavior:'smooth',block:'start'});
}
async function showMatch(){
 const a=$('#nm').value.trim(),b=$('#nm2').value.trim();
 if(!a||!b){toast('দুজনের নামই লাগবে');return}
 await ready();shareText=drawMatch(a,b);shareName=a;
 cv.scrollIntoView({behavior:'smooth',block:'start'});
}
const LUCK=['লাল গামছা','পুরোনো রিকশা','এক কাপ ভাপা পিঠা','ছাদের কোণ','নীল খাতা','কাঁচা আম','হারানো চিঠি','ভোরের আজান','জানালার রোদ','সবুজ কলম'];
const ADV=['আজ একটা অদ্ভুত আইডিয়া সত্যি হতে পারে — লিখে রাখো।','আজ কাউকে অকারণে ফোন করো, দিনটা বদলে যাবে।','আজ "না" বলার সাহস দেখাও, ভালো ফল পাবে।','আজ চা-টা একটু ধীরে খাও, উত্তরটা কাপেই আছে।','আজ পুরোনো বন্ধুর মেসেজের উত্তর দিয়ে দাও।','আজ যা ভাবছ তার অর্ধেকও ঘটবে না — চিন্তা ঝেড়ে ফেলো।'];
const COL=['মেজেন্টা','হলুদ','আকাশি','কচুপাতা সবুজ','কমলা','বেগুনি'];
function fortune(n){
 const d=new Date(),k=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
 const r=rng(norm(n)+k),pick=a=>a[Math.floor(r()*a.length)];
 $('#fortune').innerHTML=`<b>আজকের ভাগ্যবাণী, ${n}</b>\n${pick(ADV)}\nভাগ্যবান জিনিস: ${pick(LUCK)}\nভাগ্যবান রং: ${pick(COL)} · সংখ্যা: ${bnDigits(1+Math.floor(r()*99))}`;
}
async function remix(){
 const n=$('#nm').value.trim();if(!n)return;
 salt=String(Math.random());await ready();shareText=drawSolo(n);
}
$('#remix').onclick=remix;
function blob(){return new Promise(res=>cv.toBlob(res,'image/png'))}
async function doShare(){
 const b=await blob();const file=new File([b],'amar-aura.png',{type:'image/png'});
 const url=baseUrl()+(shareName?'?from='+encodeURIComponent(shareName):'');
 try{
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:shareText+' '+url});return}
  if(navigator.share){await navigator.share({text:shareText,url});return}
 }catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(shareText+' '+url);toast('লিংকসহ লেখা কপি হয়েছে — ছবি সেভ করে পোস্ট দাও')}
 catch(e){toast('ছবি সেভ করে পোস্ট দাও')}
}
async function doSave(){
 const b=await blob();const a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='amar-aura.png';document.body.appendChild(a);a.click();a.remove();
 toast('ছবি সেভ হচ্ছে');
}
$('#go').onclick=showSolo;$('#mt').onclick=showMatch;$('#share').onclick=doShare;$('#save').onclick=doSave;
$('#nm').addEventListener('keydown',e=>{if(e.key==='Enter')showSolo()});
$('#nm2').addEventListener('keydown',e=>{if(e.key==='Enter')showMatch()});
if(from){const b=$('#banner');b.hidden=false;b.textContent=`${from} তোমাকে চ্যালেঞ্জ করেছে! নাম লিখে নিজের অরা বের করো, তারপর মিলিয়ে দেখো।`}

// PWA
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$('#inst').hidden=true};
</script>
